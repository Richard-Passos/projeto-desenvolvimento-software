[project]
name = "my-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "midiutil>=1.2.1",
    "pygame-ce>=2.5.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["midiutil", "midiutil.*"]
ignore_missing_imports = true
