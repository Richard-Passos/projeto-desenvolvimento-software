
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desen-software"
version = "0.1.0"
description = "Projeto de desenvolvimento de software"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "midiutil>=1.2.1",
    "pygame-ce>=2.5.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["midiutil", "midiutil.*"]
ignore_missing_imports = true

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true